# PR 생성 시 빌드 후 Firebase Hosting 미리보기 채널 배포
name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # .env 없이 빌드하면 src/lib/*.embedded.ts 폴백(운영과 동일 값)을 사용한다
      - run: npm run build
      - name: Deploy Firebase preview
        id: firebase_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WARRANTY_MANAGEMENT_COMMON }}
          projectId: warranty-management-common
      - name: Notify Discord
        if: ${{ always() }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not configured; skipping notification."
            exit 0
          fi

          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=5763719
            TITLE="✅ Firebase 미리보기 배포 성공"
          else
            COLOR=15548997
            TITLE="❌ Firebase 미리보기 배포 실패"
          fi

          RUN_URL="$SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID"
          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg repository "$REPOSITORY" \
            --arg actor "$ACTOR" \
            --arg pr_number "$PR_NUMBER" \
            --arg pr_title "$PR_TITLE" \
            --arg pr_url "$PR_URL" \
            --arg run_url "$RUN_URL" \
            --argjson color "$COLOR" \
            '{embeds: [{title: $title, color: $color, fields: [
              {name: "Repository", value: $repository, inline: true},
              {name: "Triggered by", value: $actor, inline: true},
              {name: "Pull request", value: ("[#" + $pr_number + " " + ($pr_title[0:900]) + "](" + $pr_url + ")"), inline: false},
              {name: "Workflow", value: ("[View run](" + $run_url + ")"), inline: false}
            ]}]}' )

          curl --fail-with-body --retry 3 \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"
