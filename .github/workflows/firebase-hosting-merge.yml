# main 머지 시 빌드 후 Firebase Hosting 운영 배포
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # .env 없이 빌드하면 src/lib/*.embedded.ts 폴백(운영과 동일 값)을 사용한다
      - run: npm run build
      - name: Deploy to Firebase Hosting
        id: firebase_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WARRANTY_MANAGEMENT_COMMON }}
          channelId: live
          projectId: warranty-management-common
      - name: Notify Discord
        if: ${{ always() }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not configured; skipping notification."
            exit 0
          fi

          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=5763719
            TITLE="✅ Firebase 운영 배포 성공"
          else
            COLOR=15548997
            TITLE="❌ Firebase 운영 배포 실패"
          fi

          SHORT_SHA="${COMMIT_SHA:0:7}"
          RUN_URL="$SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID"
          COMMIT_URL="$SERVER_URL/$REPOSITORY/commit/$COMMIT_SHA"
          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg repository "$REPOSITORY" \
            --arg actor "$ACTOR" \
            --arg commit_message "$COMMIT_MESSAGE" \
            --arg commit "$SHORT_SHA" \
            --arg commit_url "$COMMIT_URL" \
            --arg run_url "$RUN_URL" \
            --argjson color "$COLOR" \
            '{embeds: [{title: $title, color: $color, fields: [
              {name: "Repository", value: $repository, inline: true},
              {name: "Triggered by", value: $actor, inline: true},
              {name: "Commit", value: ("[" + $commit + "](" + $commit_url + ")"), inline: false},
              {name: "Message", value: ($commit_message[0:1000]), inline: false},
              {name: "Workflow", value: ("[View run](" + $run_url + ")"), inline: false}
            ]}]}' )

          curl --fail-with-body --retry 3 \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"
